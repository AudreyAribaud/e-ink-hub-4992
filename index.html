<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Ink Games Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="eink-header">
    <h1>E-INK GAMES</h1>
    <div class="header-controls">
      <button id="theme-toggle" class="eink-btn" aria-label="Inverser les couleurs">Inverser</button>
    </div>
  </header>

  <nav class="game-selector">
    <button class="nav-btn active" data-game="sudoku">Sudoku</button>
    <button class="nav-btn" data-game="mines">Démineur</button>
    <button class="nav-btn" data-game="wordle">Le Mot</button>
    <button class="nav-btn" data-game="tictactoe">Morpion</button>
  </nav>

  <main class="game-container">
    <!-- SUDOKU -->
    <section id="game-sudoku" class="game-section active">
      <div class="game-controls">
        <button id="sudoku-new" class="eink-btn">Nouveau</button>
        <button id="sudoku-check" class="eink-btn">Vérifier</button>
        <span id="sudoku-status" class="status-text"></span>
      </div>
      <div class="sudoku-grid-wrapper">
        <div id="sudoku-grid" class="sudoku-grid"></div>
      </div>
      <div class="sudoku-keypad">
        <button class="keypad-btn" data-val="1">1</button>
        <button class="keypad-btn" data-val="2">2</button>
        <button class="keypad-btn" data-val="3">3</button>
        <button class="keypad-btn" data-val="4">4</button>
        <button class="keypad-btn" data-val="5">5</button>
        <button class="keypad-btn" data-val="6">6</button>
        <button class="keypad-btn" data-val="7">7</button>
        <button class="keypad-btn" data-val="8">8</button>
        <button class="keypad-btn" data-val="9">9</button>
        <button class="keypad-btn" data-val="clear">Effacer</button>
      </div>
    </section>

    <!-- MINESWEEPER -->
    <section id="game-mines" class="game-section">
      <div class="game-controls">
        <button id="mines-reset" class="eink-btn">Recommencer</button>
        <button id="mines-mode-toggle" class="eink-btn">Mode: Découvrir</button>
        <span id="mines-status" class="status-text">Mines: 10</span>
      </div>
      <div class="mines-grid-wrapper">
        <div id="mines-grid" class="mines-grid"></div>
      </div>
    </section>

    <!-- WORDLE -->
    <section id="game-wordle" class="game-section">
      <div class="game-controls">
        <button id="wordle-reset" class="eink-btn">Nouveau Mot</button>
        <span id="wordle-status" class="status-text">Devinez le mot en 6 essais</span>
      </div>
      <div class="wordle-grid-wrapper">
        <div id="wordle-grid" class="wordle-grid"></div>
      </div>
      <div id="wordle-keyboard" class="wordle-keyboard"></div>
    </section>

    <!-- TIC TAC TOE -->
    <section id="game-tictactoe" class="game-section">
      <div class="game-controls">
        <button id="ttt-reset" class="eink-btn">Recommencer</button>
        <span id="ttt-status" class="status-text">À vous de jouer (X)</span>
      </div>
      <div class="ttt-grid-wrapper">
        <div id="ttt-grid" class="ttt-grid"></div>
      </div>
    </section>
  </main>

  <footer class="eink-footer">
    <p>Optimisé pour liseuses et écrans E-Ink. Pas d'animations, contraste maximal.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
